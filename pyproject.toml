[project]
name = "md-viewer"
version = "0.9.0"
description = "Serve local markdown and source files as browsable pages"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "markdown-it-py[linkify,plugins]",
    "mdit-py-plugins",
    "pygments",
    "weasyprint>=70",
]

[project.scripts]
md-viewer = "md_viewer.cli:main"

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_viewer"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["md_viewer"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
